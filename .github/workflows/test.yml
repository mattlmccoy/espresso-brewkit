name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      # Only Chromium; the suite does not test cross-browser rendering.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm test
